name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-pip \
            git \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libreadline-dev \
            libsqlite3-dev \
            libssl-dev \
            libbz2-dev \
            liblzma-dev \
            tk-dev \
            libffi-dev \
            curl \
            wget \
            unzip \
            ant \
            cmake

      - name: Install Buildozer and Cython
        run: |
          pip install buildozer "cython<3"

      - name: Prepare Android SDK (full control)
        run: |
          SDK_ROOT=/home/runner/.buildozer/android/platform/android-sdk
          CMDLINE_DIR=$SDK_ROOT/cmdline-tools/latest

          mkdir -p $CMDLINE_DIR

          # Скачиваем commandlinetools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools/* $CMDLINE_DIR/

          # Принимаем лицензии
          JAVA_HOME=$JAVA_HOME PATH=$JAVA_HOME/bin:$PATH \
            yes | $CMDLINE_DIR/bin/sdkmanager --sdk_root=$SDK_ROOT --licenses

          # Устанавливаем обязательные компоненты
          JAVA_HOME=$JAVA_HOME PATH=$JAVA_HOME/bin:$PATH \
            $CMDLINE_DIR/bin/sdkmanager --sdk_root=$SDK_ROOT \
              "platform-tools" \
              "platforms;android-31" \
              "build-tools;30.0.3"

          # Создаём символическую ссылку, чтобы Buildozer видел sdkmanager по ожидаемому пути
          mkdir -p $SDK_ROOT/tools/bin
          ln -s $CMDLINE_DIR/bin/sdkmanager $SDK_ROOT/tools/bin/sdkmanager

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotlovan-apk
          path: bin/*.apk
          retention-days: 7
