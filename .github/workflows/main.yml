name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-pip \
            git \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libreadline-dev \
            libsqlite3-dev \
            libssl-dev \
            libbz2-dev \
            liblzma-dev \
            tk-dev \
            libffi-dev \
            curl \
            wget \
            unzip \
            openjdk-17-jdk \
            ant \
            cmake

      - name: Install Buildozer and Cython
        run: |
          pip install buildozer "cython<3"

      - name: Prepare Buildozer
        run: |
          # Buildozer сам скачает Android SDK/NDK при первой сборке
          buildozer init || true
          # Если buildozer.spec уже есть — не перезаписываем

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotlovan-apk
          path: bin/*.apk
          retention-days: 7
